# 全部直连 + 广告域名拦截；无需新增节点。
# 首页保持连接开启，全局路由选择「配置」，不要选择「直连」。
# 首页仍可选中一个已有节点；本配置的业务请求不使用 PROXY。
[General]
dns-server = system
fallback-dns-server = system
dns-direct-system = true
# 解析失败也不转代理；允许私网 DNS 应答，避免被判为劫持而转代理。
dns-direct-fallback-proxy = false
private-ip-answer = true
update-url = https://raw.githubusercontent.com/Craigfu616/proxy-adblock-config/main/shadowrocket/direct-adblock.conf

[Rule]
# 顺序：精确放行 → 自定义拦截 → 上游广告 → 其他直连。
RULE-SET,https://raw.githubusercontent.com/Craigfu616/proxy-adblock-config/main/rules/allow.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/Craigfu616/proxy-adblock-config/main/rules/block.list,REJECT
DOMAIN-SET,https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Surge-Only.Ads.list,REJECT
FINAL,DIRECT


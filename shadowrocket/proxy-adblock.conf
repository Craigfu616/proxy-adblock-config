# 基础分流 + 去广告：局域网/中国 IP 直连，其余使用首页选中的已有节点。
# 已有复杂分流的用户，优先使用 prepend-rules.conf 合并到当前配置。
# 首页保持连接开启，全局路由选择「配置」。
[General]
dns-server = system
update-url = https://raw.githubusercontent.com/Craigfu616/proxy-adblock-config/main/shadowrocket/proxy-adblock.conf

[Rule]
RULE-SET,https://raw.githubusercontent.com/Craigfu616/proxy-adblock-config/main/rules/allow.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/Craigfu616/proxy-adblock-config/main/rules/block.list,REJECT
DOMAIN-SET,https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Surge-Only.Ads.list,REJECT
# 广告规则必须放在 GEOIP/CN 和 FINAL 前面，否则国内广告也会被提前直连。
DOMAIN-SUFFIX,local,DIRECT
DOMAIN-SUFFIX,lan,DIRECT
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR6,::1/128,DIRECT,no-resolve
IP-CIDR6,fc00::/7,DIRECT,no-resolve
IP-CIDR6,fe80::/10,DIRECT,no-resolve
GEOIP,CN,DIRECT
FINAL,PROXY

